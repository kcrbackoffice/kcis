<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KCIS</title>
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KCIS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF7F3">
<meta name="color-scheme" content="only light">
<link rel="prefetch" href="pak-netral.webp"><link rel="prefetch" href="pak-bangga.webp"><link rel="prefetch" href="pak-ingat.webp">
<style>
  html,body{margin:0;height:100%;background:#FBF7F3;font-family:system-ui,sans-serif;color-scheme:only light}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;
    padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#FBF7F3;color-scheme:only light}
  #msg{position:fixed;inset:0;display:grid;place-items:center;color:#6F6266;font-size:14px;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="msg"><div><img src="ikon-192.png" alt="" width="96" height="96"><br>Memuat KCIS…</div></div>
<iframe id="app" title="KCIS - Kacaribu Internal System" allow="geolocation; clipboard-write"></iframe>
<script>
/* ====== GANTI dengan link web app KCIS Anda (yang berakhiran /exec) ====== */
const KCIS_URL = 'https://script.google.com/macros/s/AKfycbyolUcx0fn7cOqi0zjbwFugANUUh3RBKnkTP5w2wq-nhmmYdDJCOD7auqRW841dZsw6/exec';
/* ======================================================================== */

const q = new URLSearchParams(location.search);
/* v7.6: struk digital pelanggan (link dari WhatsApp KCR): tampilkan struknya saja, tanpa login & tanpa kode perangkat */
const STRUK = /^[A-Za-z0-9]{20,40}$/.test(q.get('s') || '') ? q.get('s') : '';
if (STRUK && /^https:\/\/script\.google\.com\/.+\/exec$/.test(KCIS_URL)) {
  document.title = 'Struk digital KCR';
  const f0 = document.getElementById('app');
  f0.onload = () => { document.getElementById('msg').style.display = 'none'; };
  f0.src = KCIS_URL + '?s=' + STRUK;
  throw new Error('struk');   // berhenti di sini: bagian KCIS di bawah tidak dijalankan
}
// Kode perangkat disimpan di halaman ini (penyimpanannya permanen), jadi HP tidak perlu disetujui ulang.
let dev = q.get('d');
try { if (!/^D[0-9a-f]{24}$/.test(dev || '')) dev = localStorage.getItem('kcis_dev'); } catch (e) {}
if (!/^D[0-9a-f]{24}$/.test(dev || '')) dev = 'D' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
try { localStorage.setItem('kcis_dev', dev); } catch (e) {}
if (q.get('d') !== dev) history.replaceState(null, '', location.pathname + '?d=' + dev);

if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(KCIS_URL)) {
  document.getElementById('msg').innerHTML = '<div>Link KCIS belum diisi di file index.html.</div>';
} else {
  const f = document.getElementById('app');
  f.onload = () => { document.getElementById('msg').style.display = 'none'; };
  f.src = KCIS_URL + '?d=' + dev;
}

/* ====== v7.5: jembatan cetak slip thermal (RawBT) ======
   KCIS (di dalam bingkai) mengirim pesan berisi data cetak. Halaman ini yang membuka aplikasi RawBT,
   karena bingkai Google tidak diizinkan membuka aplikasi lain. Hanya pesan dari server Google yang diterima. */
const ASAL_OK = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/;
const CETAK_OK = /^intent:base64,[A-Za-z0-9+\/=]+#Intent;scheme=rawbt;package=ru\.a402d\.rawbtprinter;end;$/;
const KV_OK = ['kcis_tok', 'kcis_view', 'kcis_draf_nota', 'kcis_sales'];
const WA_OK = /^https:\/\/wa\.me\/\d{8,15}\?text=[^\s]*$/;
window.addEventListener('message', function (ev) {
  if (!ASAL_OK.test(ev.origin)) return;
  const d = ev.data || {};
  if (d.kcis === 'ping') { try { ev.source.postMessage({ kcis: 'pong', v: 3 }, ev.origin); } catch (e) {} return; }
  if (d.kcis === 'print' && typeof d.url === 'string' && CETAK_OK.test(d.url)) {
    try { ev.source.postMessage({ kcis: 'printAck' }, ev.origin); } catch (e) {}
    window.location.href = d.url;
  }
  /* v7.6: simpanan tetap (tanda masuk, halaman terakhir, draf nota) supaya tidak perlu login ulang setelah reload */
  if (d.kcis === 'kvSet' && KV_OK.indexOf(d.k) >= 0) {
    try { if (d.v === null || d.v === undefined) localStorage.removeItem('kv_' + d.k); else localStorage.setItem('kv_' + d.k, String(d.v).slice(0, 2000000)); } catch (e) {}
  }
  if (d.kcis === 'kvAll') {
    const o = {}; KV_OK.forEach(function (k) { try { const v = localStorage.getItem('kv_' + k); if (v !== null) o[k] = v; } catch (e) {} });
    try { ev.source.postMessage({ kcis: 'kvAll', data: o }, ev.origin); } catch (e) {}
  }
  /* v7.6: buka WhatsApp (wa.me) dari KCIS */
  if (d.kcis === 'wa' && typeof d.url === 'string' && WA_OK.test(d.url)) {
    try { ev.source.postMessage({ kcis: 'waAck' }, ev.origin); } catch (e) {}
    window.location.href = d.url;
  }
});
</script>
</body>
</html>
